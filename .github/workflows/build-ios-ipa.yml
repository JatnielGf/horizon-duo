```yaml
name: Build Horizon iOS IPA

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Check out Horizon
        uses: actions/checkout@v4

      - name: Install Rust and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Download private Minecraft resources
        env:
          GH_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/horizon-resources"

          gh release download resources-26.3 \
            --repo JatnielGf/horizon-ios-assets \
            --pattern "26.3.zip" \
            --dir "$RUNNER_TEMP/horizon-resources"

          mkdir -p .local/horizon-client

          python3 - "$RUNNER_TEMP/horizon-resources/26.3.zip" ".local/horizon-client" <<'PY'
          import sys
          import zipfile
          import shutil
          from pathlib import Path, PurePosixPath

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise RuntimeError(f"Ruta no válida en ZIP: {name}")

                  target = destination.joinpath(*path.parts)

                  if info.is_dir() or name.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(info) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)
          PY

          test -f .local/horizon-client/26.3/horizon-resources.json

      - name: Build Horizon IPA
        run: |
          xcodebuild -version
          rustc --version

          packaging/ios/package.sh device \
            .local/horizon-client/26.3 \
            .local/ios

          test -f .local/ios/device/Horizon.ipa

      - name: Upload Horizon IPA
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS-IPA
          path: .local/ios/device/Horizon.ipa
          if-no-files-found: error
          retention-days: 7
```
